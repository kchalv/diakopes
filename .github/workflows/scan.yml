name: Σάρωση προσφορών

# Σάρωση τιμών, email για εξαιρετικές προσφορές, ανανέωση σελίδας.
# Στόχος: περίπου κάθε 5 ώρες. Ξυπνά από (α) το εξωτερικό ξυπνητήρι (wake.yml, κάθε 5 ώρες),
# (β) το cron του GitHub ως εφεδρεία (συχνά καθυστερεί ή παραλείπεται), (γ) χειροκίνητα.
# Η εργασία «gate» αποτρέπει δεύτερη σάρωση μέσα σε 3,5 ώρες, εκτός αν ξεκίνησε χειροκίνητα.
# Το ιστορικό τιμών (prices.db) φυλάγεται στον κλάδο "data" (μόνο η τελευταία έκδοση).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Ποιος ξύπνησε τη σάρωση (κενό = χειροκίνητα, τρέχει πάντα)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_GAP_MIN: "210"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ github.event.inputs.source }}" ]; then
            echo "Χειροκίνητη εκκίνηση: τρέχει πάντα"; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Ο κλάδος "data" γράφεται μόνο στο τέλος μιας πραγματικής σάρωσης, άρα δείχνει πότε έγινε η τελευταία.
          last=$(gh api "repos/${{ github.repository }}/commits/data" -q '.commit.committer.date' 2>/dev/null || true)
          if [ -z "$last" ]; then echo "Καμία προηγούμενη σάρωση"; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 60 ))
          echo "Τελευταία επιτυχής σάρωση πριν από $age λεπτά (όριο $MIN_GAP_MIN)"
          if [ "$age" -lt "$MIN_GAP_MIN" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  # Όλες οι αναζητήσεις πτήσεων (κάθε προορισμός × κάθε εβδομάδα) σε κάθε σάρωση, μοιρασμένες
  # σε παράλληλα τμήματα· το καθένα τρέχει σε δικό του server, ώστε να μη μας κόβει το Google.
  flights:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      TZ: Europe/Athens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Εξαρτήσεις
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Αναζητήσεις πτήσεων (τμήμα ${{ matrix.shard }})
        run: python collector.py --gf-shard ${{ matrix.shard }}/5 --out gf/shard-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: gf-${{ matrix.shard }}
          path: gf/
          retention-days: 1

  scan:
    needs: [gate, flights]
    # τρέχει ακόμη κι αν αποτύχει κάποιο τμήμα πτήσεων (χρησιμοποιεί όσα ολοκληρώθηκαν)
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment:
      name: github-pages
    env:
      TZ: Europe/Athens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Εξαρτήσεις
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Φόρτωση ιστορικού
        run: |
          mkdir -p data
          if git fetch -q --depth=1 origin data; then
            git show FETCH_HEAD:prices.db > data/prices.db
            echo "Ιστορικό: $(stat -c%s data/prices.db) bytes"
          else
            echo "Δεν υπάρχει ακόμη ιστορικό"
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: gf-*
          path: gf
          merge-multiple: true

      - name: Σάρωση + email
        env:
          DIAKOPES_EMAIL: ${{ secrets.DIAKOPES_EMAIL }}
        run: |
          mkdir -p gf
          python collector.py --gf-results gf

      - name: Αποθήκευση ιστορικού
        if: ${{ hashFiles('data/prices.db') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data
          git init -q -b data
          git add prices.db collector.log
          git -c user.name=diakopes-bot -c user.email=diakopes-bot@users.noreply.github.com \
              commit -q -m "Ιστορικό τιμών"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Η δημοσίευση αποτυγχάνει πού και πού από προσωρινό σφάλμα του GitHub: δεύτερη προσπάθεια.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Αναμονή πριν τη δεύτερη προσπάθεια δημοσίευσης
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - name: Δημοσίευση (δεύτερη προσπάθεια)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
