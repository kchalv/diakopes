name: Σάρωση προσφορών

# Σάρωση τιμών, email για εξαιρετικές προσφορές, ανανέωση σελίδας.
# Στόχος: περίπου κάθε 5 ώρες. Ξυπνά από (α) το εξωτερικό ξυπνητήρι (wake.yml, κάθε 5 ώρες),
# (β) το cron του GitHub ως εφεδρεία (συχνά καθυστερεί ή παραλείπεται), (γ) χειροκίνητα.
# Η εργασία «gate» αποτρέπει δεύτερη σάρωση μέσα σε 3,5 ώρες, εκτός αν ξεκίνησε χειροκίνητα.
# Το ιστορικό τιμών (prices.db) φυλάγεται στον κλάδο "data" (μόνο η τελευταία έκδοση).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Ποιος ξύπνησε τη σάρωση (κενό = χειροκίνητα, τρέχει πάντα)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_GAP_MIN: "210"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ github.event.inputs.source }}" ]; then
            echo "Χειροκίνητη εκκίνηση: τρέχει πάντα"; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh run list -R "${{ github.repository }}" -w scan.yml -s success -L 1 --json updatedAt -q '.[0].updatedAt')
          if [ -z "$last" ]; then echo "Καμία προηγούμενη σάρωση"; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 60 ))
          echo "Τελευταία επιτυχής σάρωση πριν από $age λεπτά (όριο $MIN_GAP_MIN)"
          if [ "$age" -lt "$MIN_GAP_MIN" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  scan:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Athens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Εξαρτήσεις
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Φόρτωση ιστορικού
        run: |
          mkdir -p data
          if git fetch -q --depth=1 origin data; then
            git show FETCH_HEAD:prices.db > data/prices.db
            echo "Ιστορικό: $(stat -c%s data/prices.db) bytes"
          else
            echo "Δεν υπάρχει ακόμη ιστορικό"
          fi

      - name: Σάρωση + email
        env:
          DIAKOPES_EMAIL: ${{ secrets.DIAKOPES_EMAIL }}
        run: python collector.py

      - name: Αποθήκευση ιστορικού
        if: ${{ hashFiles('data/prices.db') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data
          git init -q -b data
          git add prices.db collector.log
          git -c user.name=diakopes-bot -c user.email=diakopes-bot@users.noreply.github.com \
              commit -q -m "Ιστορικό τιμών"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
